# A release is a plain semver tag (SwiftPM reads tags as versions). This checks the tag names the
# version the SDK reports, runs the tests, and publishes the GitHub release.
name: release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches Sdk.version
        run: |
          version=$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' Sources/FunnelbaseCore/Wire.swift)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Sdk.version $version" >&2
            exit 1
          fi
      - run: swift test
      - name: Release notes from the changelog
        run: |
          awk -v v="## $GITHUB_REF_NAME" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md entry for $GITHUB_REF_NAME" >&2; exit 1; }
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
